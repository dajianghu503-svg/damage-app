name: Keep Supabase Alive
on:
  schedule:
    # 毎日2〜3回実行するように増やすのがおすすめ（GitHub Actionsの遅延対策）
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Keep Supabase Active via DB Query
        run: |
          # POSTgREST API経由でテーブルから1件だけ取得する（DBを実際に起こす）
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${{ secrets.SUPABASE_PING_URL }}/rest/v1/dummy?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "HTTP Status: $RESPONSE"
          if [ "$RESPONSE" -ne 200 ]; then
            echo "Failed to query Supabase"
            exit 1
          fi
